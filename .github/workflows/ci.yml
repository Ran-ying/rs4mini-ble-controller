name: Offline checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-and-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: node/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: node
      - run: npm test
        working-directory: node
      - run: npm exec --yes --package typescript@5.9.3 -- tsc --noEmit --strict --target ES2022 --module NodeNext --moduleResolution NodeNext examples/types-smoke.mts
        working-directory: node
      - run: npm pack --dry-run
        working-directory: node
      - run: node --check web/rs4mini.js
      - run: npm --prefix web test
      - run: sh macos/test.sh
      - run: sh macos/build.sh
      - run: sh tools/ble-probe/build.sh

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/check-boundaries.py
      - run: python -m unittest discover -s tools/research -v
      - run: python -m pip install -e ./python
      - run: python -m unittest discover -s tests -v
        working-directory: python
