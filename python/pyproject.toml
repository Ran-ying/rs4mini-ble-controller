[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rs4mini-sdk"
version = "0.7.26"
description = "Unofficial direct BLE controller for DJI RS 4 Mini"
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["bleak>=0.22,<2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["rs4mini_sdk*"]
